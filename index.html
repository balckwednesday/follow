<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🖕 Follow Me </title>
  <style>
    :root { --pink: #ff2d9a; --blue: #6547ff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh; overflow: hidden; display: grid; place-items: center;
      color: white; background: #05050b;
      font-family: system-ui, "Segoe UI", sans-serif;
    }
    .glow {
      position: fixed; inset: -25%;
      background:
        radial-gradient(ellipse at 25% 65%, #ff16872b, transparent 38%),
        radial-gradient(ellipse at 75% 35%, #5030ff35, transparent 42%),
        radial-gradient(ellipse at 50% 50%, #16102e 0%, #05050b 65%);
      animation: breathe 7s ease-in-out infinite alternate;
    }
    .grid {
      position: fixed; inset: 0; opacity: .15; pointer-events: none;
      background-image: linear-gradient(#8274ff24 1px, transparent 1px),
                        linear-gradient(90deg, #8274ff24 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse, black, transparent 75%);
    }
    .orb { position: fixed; width: 260px; height: 260px; border-radius: 50%;
      filter: blur(80px); opacity: .42; animation: drift 12s ease-in-out infinite alternate; }
    .orb.one { background: var(--pink); left: 8%; top: 10%; }
    .orb.two { background: var(--blue); right: 8%; bottom: 5%; animation-delay: -5s; }
    main { position: relative; z-index: 1; text-align: center; padding: 24px; }
    .eyebrow {
      display: inline-block; border: 1px solid #ffffff26; border-radius: 999px;
      padding: 8px 15px; color: #d6cfff; letter-spacing: .18em;
      font-size: 11px; text-transform: uppercase; backdrop-filter: blur(10px);
      animation: fadeUp .8s both;
    }
    .emoji {
      display: block; font-size: clamp(150px, 32vw, 330px); line-height: 1.2;
      margin: 16px 0 2px; cursor: pointer; user-select: none;
      filter: drop-shadow(0 0 22px #ff2d9a55);
      animation: float 3.4s ease-in-out infinite, appear 1s cubic-bezier(.2,.8,.2,1) both;
      transition: filter .25s, transform .25s;
    }
    .emoji:hover { filter: drop-shadow(0 0 30px #ff2d9a) drop-shadow(0 0 60px #6547ff80); transform: scale(1.08) rotate(-4deg); }
    h1 {
      margin: 0; font-size: clamp(22px, 4vw, 42px); font-weight: 800;
      letter-spacing: .06em; background: linear-gradient(90deg, #ff4cb2, #b6a5ff, #63c9ff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: fadeUp 1s .2s both;
    }
    p { color: #aaa8c5; margin: 12px 0 25px; font-size: clamp(13px, 2vw, 16px); animation: fadeUp 1s .35s both; }
    .insta-link { color: #d7c9ff; text-decoration: none; transition: color .2s; }
    .insta-link:hover { color: #ff62c0; }
    .instagram-button {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      border: 1px solid #ffffff30; color: white; text-decoration: none;
      background: linear-gradient(110deg, #ff2d9a30, #6547ff30);
      border-radius: 999px; padding: 12px 20px; font: inherit;
      backdrop-filter: blur(12px); transition: .25s; animation: fadeUp 1s .5s both;
    }
    .instagram-button svg { width: 25px; height: 25px; }
    .instagram-button:hover { border-color: #ff62c0; box-shadow: 0 0 28px #ff2d9a38; transform: translateY(-3px); }
    .hint { position: fixed; bottom: 18px; left: 0; right: 0; color: #77738f; font-size: 11px; letter-spacing: .14em; text-align: center; }
    .particle { position: fixed; pointer-events: none; z-index: 3; font-size: 18px; animation: burst 900ms ease-out forwards; }
    @keyframes breathe { to { transform: scale(1.08) rotate(5deg); } }
    @keyframes drift { to { transform: translate(70px, -35px) scale(1.2); } }
    @keyframes float { 0%,100% { translate: 0 0; } 50% { translate: 0 -12px; } }
    @keyframes appear { from { opacity: 0; scale: .6; } to { opacity: 1; scale: 1; } }
    @keyframes fadeUp { from { opacity: 0; translate: 0 18px; } to { opacity: 1; translate: 0 0; } }
    @keyframes burst { to { transform: translate(var(--x), var(--y)) rotate(180deg) scale(.2); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <div class="glow"></div><div class="grid"></div>
  <div class="orb one"></div><div class="orb two"></div>
  <main>
    <div class="eyebrow">NO WORDS NEEDED</div>
    <div class="emoji" id="emoji" role="button" tabindex="0" aria-label="اضغط لإظهار تأثير">🖕</div>
    <h1>دير ابوني</h1>
    <p><a class="insta-link" href="https://www.instagram.com/xlx_6l6_xlx/" target="_blank" rel="noopener noreferrer">xlx_6l6_xlx</a></p>
    <a class="instagram-button" href="https://www.instagram.com/xlx_6l6_xlx/" target="_blank" rel="noopener noreferrer" aria-label="افتح صفحة إنستغرام">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <defs><linearGradient id="igGradient" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ffcc45"/><stop offset=".35" stop-color="#ff2d75"/><stop offset=".7" stop-color="#c135b5"/><stop offset="1" stop-color="#6547ff"/></linearGradient></defs>
        <rect x="2" y="2" width="20" height="20" rx="6" fill="none" stroke="url(#igGradient)" stroke-width="2.2"/>
        <circle cx="12" cy="12" r="4.4" fill="none" stroke="url(#igGradient)" stroke-width="2.2"/>
        <circle cx="18" cy="6.4" r="1.35" fill="url(#igGradient)"/>
      </svg>
      <span>تابعني على إنستغرام</span>
    </a>
  </main>
  <div class="hint">CLICK THE EMOJI · FEEL THE VIBE</div>
  <script>
    const emoji = document.getElementById('emoji');
    function burst() {
      const rect = emoji.getBoundingClientRect();
      const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
      for (let i = 0; i < 18; i++) {
        const particle = document.createElement('span');
        particle.className = 'particle';
        particle.textContent = ['✦', '✧', '⚡', '💜'][Math.floor(Math.random() * 4)];
        particle.style.left = cx + 'px'; particle.style.top = cy + 'px';
        particle.style.setProperty('--x', (Math.random() * 360 - 180) + 'px');
        particle.style.setProperty('--y', (Math.random() * 300 - 150) + 'px');
        document.body.appendChild(particle);
        particle.addEventListener('animationend', () => particle.remove());
      }
      emoji.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.18) rotate(-7deg)' }, { transform: 'scale(1)' }], { duration: 360, easing: 'ease-out' });
    }
    emoji.addEventListener('click', burst);
    emoji.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); burst(); } });
  </script>
</body>
</html>
